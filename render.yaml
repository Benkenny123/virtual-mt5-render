services:
  - type: web
    name: virtual-mt5
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: VNC_PASSWORD
        generateValue: true
    disk:
      name: mt5-data
      mountPath: /config
      sizeGB: 1
